name: Release APK

# Builds the release APK for a tag and attaches it to that GitHub release.
# Runs automatically when a release is published; use "Run workflow" with a tag
# to (re)build the APK for an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the APK to (e.g. V1.0)
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your own key so installed copies update in place. Add the
      # HOLO_KEYSTORE_BASE64 / HOLO_KEYSTORE_PASSWORD / HOLO_KEY_ALIAS / HOLO_KEY_PASSWORD
      # repository secrets. Without them the APK is signed with a throwaway debug key.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.HOLO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/holo-release.jks"
            echo "HOLO_KEYSTORE_PATH=$RUNNER_TEMP/holo-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the repository release key."
          else
            echo "::notice::No HOLO_KEYSTORE_BASE64 secret set; signing with a debug key."
          fi

      - name: Build release APK
        env:
          HOLO_KEYSTORE_PASSWORD: ${{ secrets.HOLO_KEYSTORE_PASSWORD }}
          HOLO_KEY_ALIAS: ${{ secrets.HOLO_KEY_ALIAS }}
          HOLO_KEY_PASSWORD: ${{ secrets.HOLO_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="NightCityHoloOS-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          gh release upload "$TAG" "$APK" "$APK.sha256" --clobber --repo "$GITHUB_REPOSITORY"
